name: Cache dependencies

runs:
  using: 'composite'
  steps:
    - uses: actions/cache@v4
      with:
        path: '**/node_modules'
        key: bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: bun-
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: '.tool-versions'
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
